<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 192" width="128" height="192">
  <defs>
    <linearGradient id="og-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc3e8" />
      <stop offset="0.6" stop-color="#cfe58f" />
      <stop offset="1" stop-color="#7a9c3c" />
    </linearGradient>
  </defs>

  <rect width="128" height="192" fill="url(#og-sky)" />

  <circle cx="26" cy="26" r="11" fill="#ffe97a" />

