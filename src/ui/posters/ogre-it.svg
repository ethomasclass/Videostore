  <ellipse cx="28" cy="84" rx="8" ry="12" fill="#7fae3f" />
  <ellipse cx="100" cy="84" rx="8" ry="12" fill="#7fae3f" />
  <ellipse cx="64" cy="104" rx="22" ry="14" fill="#93bf52" />

  <ellipse cx="52" cy="80" rx="7" ry="8" fill="#f6f2e2" />
  <ellipse cx="76" cy="80" rx="7" ry="8" fill="#f6f2e2" />
  <circle cx="53" cy="81" r="3.4" fill="#2a2016" />
  <circle cx="75" cy="81" r="3.4" fill="#2a2016" />

  <path d="M50 102 Q64 116 78 102" stroke="#2f2416" stroke-width="3" fill="none" stroke-linecap="round" />
  <rect x="55" y="103" width="4" height="5" fill="#f6f2e2" />
  <rect x="69" y="103" width="4" height="5" fill="#f6f2e2" />

