  <ellipse cx="20" cy="126" rx="48" ry="22" fill="#6b9235" />
  <ellipse cx="104" cy="130" rx="44" ry="20" fill="#5d8230" />

  <!-- The ogre: a big round head, ears out, very pleased with himself -->
