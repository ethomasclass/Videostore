<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140" role="img" aria-label="Lackluster Video">
  <title>Lackluster Video</title>
  <!--
    A perforated admission stub: notched on both sides where it was torn from the roll.
    Deliberately not a single-jagged-edge ticket — this is its own mark, not a trace of one.
  -->
  <defs>
    <clipPath id="stub">
      <path d="M12 8 H308 V52 A16 16 0 0 0 308 88 V132 H12 V88 A16 16 0 0 0 12 52 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#stub)">
    <rect x="0" y="0" width="320" height="140" fill="#1a3a8f" />
    <rect x="0" y="0" width="320" height="140" fill="none" stroke="#f5c518" stroke-width="16" />
  </g>

  <path
    d="M12 8 H308 V52 A16 16 0 0 0 308 88 V132 H12 V88 A16 16 0 0 0 12 52 Z"
    fill="none"
    stroke="#0e2054"
    stroke-width="2"
  />

  <text
    x="160"
    y="68"
    fill="#efe9d8"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="46"
    font-weight="800"
    font-style="italic"
    letter-spacing="-1"
    text-anchor="middle"
  >LACKLUSTER</text>

  <text
    x="160"
    y="104"
    fill="#f5c518"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    font-style="italic"
    letter-spacing="11"
    text-anchor="middle"
  >VIDEO</text>
</svg>
